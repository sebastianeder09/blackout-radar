# Einstellungen des Blackout-Radars.
#
# Alles hier ist freiwillig: Ohne Änderung gelten die Standardwerte, die unten als
# Kommentar stehen. Zum Ändern das Zeichen # am Zeilenanfang entfernen und den Wert
# anpassen. Zugangsdaten (ntfy-Thema, SMTP) gehören NICHT in diese Datei, weil das
# Repository öffentlich ist. Sie kommen als "Secrets" in die GitHub-Einstellungen.

# timezone = "Europe/Vienna"

[filter]
# min_duration_minutes = 30       # Rest der Welt: erst melden, wenn der Ausfall so lange dauert
# min_affected_people = 500000    # und grob so viele Menschen betrifft
# require_power_confirmation = true   # und Strom als Ursache belegt ist
# update_interval_minutes = 120   # Zwischenstand bei laufenden Ereignissen
# end_confirm_minutes = 15        # so lange muss es ruhig sein, bevor die Entwarnung kommt
# max_notices_per_hour = 4        # höchstens so viele Meldungen je Ereignis und Stunde
# ignore_areas = []               # Gebiete, die nie gemeldet werden, z. B. ["UA", "ZA"]

[priority]
# areas = ["AT-4", "AT"]          # Vorrang: Oberösterreich und Österreich
# always_areas = ["AT-4"]         # hier wird jeder Ausfall sofort gemeldet, auch ein kleiner
# min_severity = 0.15             # übrige Vorrang-Gebiete: sofort ab diesem betroffenen Anteil (15 %)
# update_interval_minutes = 60    # Zwischenstand bei einem großen Ausfall im Vorrang-Gebiet

[daily_summary]
# enabled = true                  # tägliche Übersicht als leise Meldung, zugleich Lebenszeichen
# time = "07:00"

[health]
# alert_after_hours = 3           # Meldung, wenn eine Datenquelle so lange ausfällt
# gap_minutes = 90                # Meldung, wenn so lange kein Lauf stattgefunden hat
# europe_silent_minutes = 10      # Warnung, wenn so lange keine der Messquellen in Europa antwortet,
#                                 # Quellen außerhalb Europas aber schon
# europe_hosts = ["api.energy-charts.info", "dat.netzfrequenzmessung.de", "www.linznetz.at"]
#                                 # die Messquellen in Europa. Leere Liste: keine solche Warnung

[notify.ntfy]
# server = "https://ntfy.sh"
# skip_levels = []                # z. B. ["daily"], um die tägliche Übersicht abzuschalten

[notify.email]
# skip_levels = ["daily"]         # per E-Mail kommt die tägliche Übersicht standardmäßig nicht

[notify.public]
# Öffentlicher Alarm für alle, die die App installieren. Schaltet sich ein, sobald das Secret ALARM_KEY
# gesetzt ist. Thema und Server stehen fest in der App: Wer sie hier ändert, muss auch die App ändern.
# enabled = true
# server = "https://ntfy.sh"
# topic = "blackout-radar-alarm"
# skip_levels = []                # z. B. ["daily"]: Die tägliche Übersicht geht dann nicht an alle

[sources.frequency]
# alarm_mhz = 200                 # Alarm ab dieser Abweichung von 50 Hz
# clear_mhz = 100

[sources.load]
# countries = ["at", "de", "cz", "sk", "hu", "ch", "fr", "es", "pt", "pl"]
#                                 # ohne Italien und Slowenien: deren Werte waren bei der Prüfung lückenhaft
# drop_threshold = 0.20           # Einbruch gegenüber vergleichbaren Tagen, ab dem die Stromlast als auffällig gilt
# recover_threshold = 0.10        # näher als so am üblichen Wert gilt der Einbruch als beendet
# drop_threshold_blind = 0.40     # Schwelle, wenn das Niveau des Tages unbekannt ist (nach einer Datenlücke)

[sources.utility]
# enabled = true                  # Störmeldungen der LINZ NETZ (zählt für Oberösterreich)

[sources.news]
# max_age_minutes = 180           # ältere Berichte lösen nichts mehr aus
# world_min_sources = 3           # so viele verschiedene Medien müssen über einen Ausfall berichten
# quiet_hours = 6                 # so lange ohne neuen Bericht, dann gilt die Lage als beendet
# followup_days = 7               # so lange gelten Berichte über Ursache und Folgen danach als Aufarbeitung
# feeds_per_run = 4               # so viele Nachrichten-Feeds aus Übersee je Lauf, reihum (0: Feeds abschalten).
#                                 # Bei Verdacht auf einen großen Ausfall in Europa werden alle abgefragt.
#                                 # Die 20 Feeds stehen in blackout_radar/config.py unter "feeds".

[sources.ioda]
# enabled = false                 # weltweite Internet-Ausfälle. Der Dienst antwortet automatischen Abfragen
#                                 # nicht (zuletzt gemessen am 27.11.2026) und bleibt deshalb abgeschaltet.
