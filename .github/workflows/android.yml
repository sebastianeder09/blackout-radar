name: Android-App

# Baut die App, prüft sie im Emulator und veröffentlicht sie als Download.
# Veröffentlicht wird nur aus dem Hauptzweig und nur, wenn alle Prüfungen bestanden sind.
# Die neueste Fassung liegt immer unter
# https://github.com/sebastianeder09/blackout-radar/releases/latest/download/blackout-radar.apk

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bauen und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: APK bauen
        working-directory: android
        run: gradle --no-daemon assembleRelease assembleDebug -PbuildNumber=${{ github.run_number }}

      - name: APK prüfen
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/blackout-radar.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/blackout-radar-test.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs apk/blackout-radar.apk | tee signatur.txt
          "$tools/aapt2" dump badging apk/blackout-radar.apk | head -3
          {
            echo "## App, Bau ${{ github.run_number }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Größe | $(du -k apk/blackout-radar.apk | cut -f1) KB |"
            echo "| SHA-256 | \`$(sha256sum apk/blackout-radar.apk | cut -d' ' -f1)\` |"
            echo "| Zertifikat | \`$(grep -m1 'SHA-256' signatur.txt | awk '{print $NF}')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: apk/
          retention-days: 30

  emulator:
    name: Emulator (Android API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: apk

      - name: KVM freigeben
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Nachgestellter Blackout für den Testbau
        run: |
          python3 android/test/fixtures.py "$RUNNER_TEMP/blackout" 200
          nohup python3 android/test/fake_ntfy.py "$RUNNER_TEMP/blackout" 8765 > "$RUNNER_TEMP/fake_ntfy.log" 2>&1 &
          sleep 2
          curl -sf "http://127.0.0.1:8765/status.json" > /dev/null

      - name: Emulator-Test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          OUT: ${{ github.workspace }}/ergebnis
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android/test/emulator.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: ergebnis/
          retention-days: 14

      # Für Prüfungen, die nur die Protokolle lesen können: Vorschau.java holt die Bilder wieder heraus.
      - name: Bilder verkleinert ins Protokoll
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        run: java -Djava.awt.headless=true android/test/Vorschau.java schreiben ergebnis 405

  release:
    name: Veröffentlichen
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: apk

      - name: Download anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}" apk/blackout-radar.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Blackout-Radar App 1.${{ github.run_number }}" \
            --notes "Android-App zum Blackout-Radar. Auf dem Handy herunterladen, antippen und installieren. Eine ältere Fassung wird dabei ersetzt, Thema und Einstellungen bleiben erhalten. Anleitung: android/README.md"
